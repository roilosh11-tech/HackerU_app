<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  button{color:inherit;font-family:inherit}
  input{font-family:inherit}
  html,body{margin:0;padding:0}
  body{background:#1b212b;font-family:'Assistant',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#98b1ff}
  a:hover{color:#b7c6ff}
  @keyframes cbup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes cbspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="rtl" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1100px 620px at 78% -8%, #232c3b 0%, #1b212b 58%);color:#f6f8fc">

  <div style="width:100%;max-width:428px;animation:cbup .5s ease both">

    <!-- brand -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px">
      <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#2b3550,#1a2030);border:1px solid #505c6d;display:flex;align-items:center;justify-content:center">
        <div style="width:24px;height:24px;border-radius:50% 50% 50% 5px;border:2.4px solid #98b1ff"></div>
      </div>
      <div style="text-align:center">
        <div style="font-weight:800;font-size:25px;letter-spacing:-.4px">מוח הקורס</div>
        <div style="font-size:14px;color:#a4afc0;margin-top:3px">מרחב הלמידה המשותף של הכיתה</div>
      </div>
    </div>

    <!-- card -->
    <div style="background:#252d39;border:1px solid #3f4956;border-radius:20px;padding:26px 24px 24px;box-shadow:0 24px 60px -28px rgba(0,0,0,.7)">

      <!-- segmented -->
      <div style="display:flex;gap:5px;padding:4px;background:#1f2733;border:1px solid #3a4451;border-radius:13px;margin-bottom:20px">
        <button onClick="{{ onModeLogin }}" style="flex:1;padding:9px;border:0;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;background:{{ loginTabBg }};color:{{ loginTabColor }}">התחברות</button>
        <button onClick="{{ onModeRegister }}" style="flex:1;padding:9px;border:0;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;background:{{ registerTabBg }};color:{{ registerTabColor }}">הרשמה</button>
      </div>

      <!-- SUCCESS / pending state -->
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:14px 6px 8px">
          <div style="width:52px;height:52px;border-radius:50%;background:rgba(147,224,177,.14);border:1px solid rgba(147,224,177,.4);display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" fill="none" stroke="#93e0b1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
          </div>
          <div style="font-weight:700;font-size:17px">{{ doneTitle }}</div>
          <div style="font-size:14.5px;color:#a4afc0;line-height:1.6">{{ doneMsg }}</div>
          <button onClick="{{ onModeLogin }}" style="margin-top:6px;background:#2e3743;border:1px solid #505c6d;color:#ccd4e1;font-weight:600;font-size:14px;padding:10px 18px;border-radius:11px;cursor:pointer">חזרה למסך הכניסה</button>
        </div>
      </sc-if>

      <!-- FORM -->
      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:14px">

        <!-- display name (register only) -->
        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#ccd4e1">
          שם תצוגה
          <input value="{{ displayName }}" onInput="{{ onDisplayName }}" placeholder="איך שיופיע בכיתה" style="width:100%;background:#1f2733;border:1px solid #3f4956;border-radius:11px;padding:11px 13px;color:#f6f8fc;font-size:15px;outline:none" />
        </label>
        </sc-if>

        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#ccd4e1">
          שם משתמש
          <input value="{{ username }}" onInput="{{ onUsername }}" autoComplete="username" placeholder="באנגלית, ללא רווחים" dir="ltr" style="width:100%;background:#1f2733;border:1px solid #3f4956;border-radius:11px;padding:11px 13px;color:#f6f8fc;font-size:15px;outline:none;text-align:right" />
        </label>

        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#ccd4e1">
          סיסמה
          <input value="{{ password }}" onInput="{{ onPassword }}" onKeyDown="{{ onKeyDown }}" type="password" autoComplete="{{ pwAutocomplete }}" placeholder="לפחות 4 תווים" dir="ltr" style="width:100%;background:#1f2733;border:1px solid #3f4956;border-radius:11px;padding:11px 13px;color:#f6f8fc;font-size:15px;outline:none;text-align:right" />
        </label>

        <!-- avatar picker (register only) -->
        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="font-size:13px;font-weight:600;color:#ccd4e1">בחר/י צבע לפרופיל</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button onClick="{{ onPickIndigo }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#98b1ff;box-shadow:{{ av.indigo }}"></button>
            <button onClick="{{ onPickGreen }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#93e0b1;box-shadow:{{ av.green }}"></button>
            <button onClick="{{ onPickSky }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#95c8f0;box-shadow:{{ av.sky }}"></button>
            <button onClick="{{ onPickAmber }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#eec38a;box-shadow:{{ av.amber }}"></button>
            <button onClick="{{ onPickRose }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#f0a3a3;box-shadow:{{ av.rose }}"></button>
            <button onClick="{{ onPickViolet }}" style="width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:#b6a0f0;box-shadow:{{ av.violet }}"></button>
          </div>
        </div>
        </sc-if>

        <!-- error -->
        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <div style="background:rgba(240,163,163,.1);border:1px solid rgba(240,163,163,.32);color:#f0a3a3;font-size:13.5px;font-weight:500;padding:10px 13px;border-radius:11px;line-height:1.5">{{ error }}</div>
        </sc-if>

        <!-- submit -->
        <button onClick="{{ onSubmit }}" disabled="{{ busy }}" style="margin-top:4px;display:flex;align-items:center;justify-content:center;gap:9px;background:#98b1ff;border:0;color:#141a24;font-weight:800;font-size:15.5px;padding:13px;border-radius:12px;cursor:pointer;opacity:{{ submitOpacity }}">
          <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width:15px;height:15px;border:2.4px solid rgba(20,26,36,.35);border-top-color:#141a24;border-radius:50%;display:inline-block;animation:cbspin .7s linear infinite"></span></sc-if>
          {{ submitLabel }}
        </button>

      </div>
      </sc-if>

    </div>

    <!-- footer note -->
    <div style="text-align:center;margin-top:18px;font-size:12.5px;color:#7f8a9b;line-height:1.6">{{ footNote }}</div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    booting: true,
    mode: 'login',          // 'login' | 'register'
    displayName: '',
    username: '',
    password: '',
    avatar: 'indigo',
    error: '',
    busy: false,
    done: false,
    doneTitle: '',
    doneMsg: '',
    offline: false,
  };

  async componentDidMount() {
    const API = window.CourseAPI;
    if (!API) { this.setState({ booting: false }); return; }
    await API.boot();
    // Already logged in with a valid session? Go straight to the app.
    if (API.isOnline() && API.isLoggedIn()) {
      location.href = 'Course Brain.dc.html';
      return;
    }
    this.setState({ booting: false, offline: !API.isOnline() });
  }

  setField(k) { return (e) => this.setState({ [k]: e.target.value, error: '' }); }
  pick(a) { return () => this.setState({ avatar: a }); }

  async submit() {
    if (this.state.busy) return;
    const API = window.CourseAPI;
    const { mode, username, password, displayName, avatar } = this.state;
    const u = username.trim();
    if (u.length < 3) { this.setState({ error: 'שם המשתמש חייב להכיל לפחות 3 תווים' }); return; }
    if (password.length < 4) { this.setState({ error: 'הסיסמה חייבת להכיל לפחות 4 תווים' }); return; }
    if (mode === 'register' && !displayName.trim()) { this.setState({ error: 'נא להזין שם תצוגה' }); return; }

    this.setState({ busy: true, error: '' });
    try {
      if (mode === 'register') {
        const r = await API.register({ username: u, displayName: displayName.trim(), password, avatar });
        if (r && r.offline) {
          // preview mode — treat as immediate login
          await API.login({ username: u, password });
          location.href = 'Course Brain.dc.html';
          return;
        }
        this.setState({
          busy: false, done: true,
          doneTitle: 'הבקשה נשלחה!',
          doneMsg: 'החשבון שלך נוצר וממתין לאישור המנהל/ת. תקבל/י גישה מיד לאחר האישור.',
        });
      } else {
        await API.login({ username: u, password });
        location.href = 'Course Brain.dc.html';
      }
    } catch (e) {
      this.setState({ busy: false, error: e.message || 'אירעה שגיאה, נסה/י שוב' });
    }
  }

  renderVals() {
    const st = this.state;
    const isRegister = st.mode === 'register';
    const acc = '#98b1ff';
    const ring = (k) => st.avatar === k ? ('0 0 0 3px #252d39, 0 0 0 5px ' + acc) : 'none';
    const tabActive = { bg: '#98b1ff', color: '#141a24' };
    const tabIdle = { bg: 'transparent', color: '#a4afc0' };
    const lt = !isRegister ? tabActive : tabIdle;
    const rt = isRegister ? tabActive : tabIdle;

    let footNote = st.offline
      ? 'מצב תצוגה מקדימה — הנתונים נשמרים מקומית בדפדפן. לאחר פריסה לשרת, ההתחברות והשמירה יעבדו לכל הכיתה.'
      : 'חשבון חדש מצריך אישור מהמנהל/ת לפני הכניסה הראשונה.';

    return {
      showForm: !st.done,
      done: st.done,
      doneTitle: st.doneTitle,
      doneMsg: st.doneMsg,
      isRegister,

      onModeLogin: () => this.setState({ mode: 'login', error: '', done: false }),
      onModeRegister: () => this.setState({ mode: 'register', error: '', done: false }),

      loginTabBg: lt.bg, loginTabColor: lt.color,
      registerTabBg: rt.bg, registerTabColor: rt.color,

      displayName: st.displayName,
      username: st.username,
      password: st.password,
      onDisplayName: this.setField('displayName'),
      onUsername: this.setField('username'),
      onPassword: this.setField('password'),
      onKeyDown: (e) => { if (e.key === 'Enter') this.submit(); },
      pwAutocomplete: isRegister ? 'new-password' : 'current-password',

      av: {
        indigo: ring('indigo'), green: ring('green'), sky: ring('sky'),
        amber: ring('amber'), rose: ring('rose'), violet: ring('violet'),
      },
      onPickIndigo: this.pick('indigo'), onPickGreen: this.pick('green'),
      onPickSky: this.pick('sky'), onPickAmber: this.pick('amber'),
      onPickRose: this.pick('rose'), onPickViolet: this.pick('violet'),

      error: st.error,
      busy: st.busy,
      submitOpacity: st.busy ? 0.7 : 1,
      submitLabel: isRegister ? 'צור/צרי חשבון' : 'כניסה',
      onSubmit: () => this.submit(),

      footNote,
    };
  }
}
</script>
</body>
</html>
